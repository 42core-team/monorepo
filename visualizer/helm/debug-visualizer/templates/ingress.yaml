{{- $previewEnabled := dig "traefikPreview" "enabled" false .Values.ingress -}}
{{- if and $previewEnabled (not .Values.ingress.enabled) -}}
{{- fail "ingress.traefikPreview.enabled requires ingress.enabled=true" -}}
{{- end -}}
{{- if and $previewEnabled (eq .Values.ingress.className "traefik") -}}
{{- fail "disable ingress.traefikPreview when the primary ingress class is traefik" -}}
{{- end -}}
{{- if .Values.ingress.enabled }}
{{ include "debug-visualizer.ingress" (dict "root" . "preview" false) }}
{{- if $previewEnabled }}
---
{{ include "debug-visualizer.ingress" (dict "root" . "preview" true) }}
{{- end }}
{{- end }}
