replicaCount: 2

image:
  repository: ghcr.io/${REPO}
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: "nginx"
  annotations: {}
  # Add a second, HTTPS-only Traefik route without changing the primary route.
  # Requires Traefik and the existing cert-manager TLS Secrets to be ready.
  traefikPreview:
    enabled: false
  hosts:
    - host: visualizer.coregame.sh
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}

