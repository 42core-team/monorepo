events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    etag on;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_disable "msie6";
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        application/vnd.ms-fontobject
        font/ttf
        font/otf
        image/svg+xml;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;
        absolute_redirect off;

        root /usr/share/nginx/html;
        index index.html;

        # Canonical trailing slashes are required for relative browser URLs.
        location = /dev {
            if (!-f $document_root/dev/index.html) { return 404; }
            return 308 /dev/$is_args$args;
        }

        location ~ ^/(v[0-9]+\.[0-9]+\.[0-9]+)$ {
            if (!-f $document_root/$1/index.html) { return 404; }
            return 308 /$1/$is_args$args;
        }

        # Never cache any HTML entrypoint.
        location ~ ^/(?:index\.html|(?:dev|v[0-9]+\.[0-9]+\.[0-9]+)/index\.html)$ {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            try_files $uri =404;
        }

        # Never cache the service worker
        location = /sw.js {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        # Long-cache only hashed JS/CSS (immutable)
        location ~* "-[A-Za-z0-9]{8,}\.(?:js|css)(?:\.map)?$" {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # Short TTL for non-hashed JS/CSS
        location ~* "\.(?:js|css)$" {
            add_header Cache-Control "public, max-age=600, must-revalidate" always;
        }

        # Short TTL for images and fonts
        location ~* "\.(?:png|jpg|jpeg|gif|ico|svg|ttf|woff|woff2)$" {
            add_header Cache-Control "public, max-age=600, must-revalidate" always;
        }

        # Keep each embedded visualizer's SPA fallback inside its own subpath.
        location ~ ^/(dev|v[0-9]+\.[0-9]+\.[0-9]+)(?:/.*)?$ {
            if (!-f $document_root/$1/index.html) { return 404; }
            try_files $uri $uri/ /$1/index.html;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
