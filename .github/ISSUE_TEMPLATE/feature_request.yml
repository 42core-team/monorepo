name: 💡 Feature Request
description: Suggest a new feature or improvement
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature!
        Please provide as much context as possible so we can evaluate it effectively.

  - type: textarea
    id: explanation
    attributes:
      label: Feature Summary
      description: Short explanation of the feature or improvement.
      placeholder: A concise summary of your idea...
    validations:
      required: true

  - type: textarea
    id: usefulness
    attributes:
      label: Why is this useful?
      description: Why would this feature be needed or beneficial?
      placeholder: Describe how it improves the experience or solves a problem.
    validations:
      required: true

  - type: textarea
    id: implementation
    attributes:
      label: How could it work?
      description: How do you imagine this feature being implemented or functioning in-game?
      placeholder: Outline a rough idea of the implementation details.

  - type: textarea
    id: references
    attributes:
      label: References / Examples
      description: Optional links, examples, screenshots, or notes.
      placeholder: Add any helpful context or inspiration links here.

  - type: markdown
    attributes:
      value: |
        Please try to give the issue an appropriate label based on the components of Core Game it likely affects.

  - type: markdown
    attributes:
      value: |
        If this is an vague idea rather than a specific feature request, please change the issue type to "Idea".
        If the issue must be further discussed by the full Core Game team before it can be worked on, please change the issue type to "Refinement".
