name: 🪲 Bug Report
description: Report unexpected or unintended behaviour
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        ⭐️ Thanks for taking the time to report this issue!
        Please fill out the details below as clearly as possible.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: |
        1. What did you do?
        2. What did you expect to happen?
        3. What happened instead?
      placeholder: When I ... I expected ... but instead ...
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment / Context
      description: Which version, branch, event, bot repository, or visualizer replay URL did this occur on?
      placeholder: "e.g. main branch, v1.2.3, event: summer_2025, repo: github.com/..., replay: coregame.de/... at tick 42"
    validations:
      required: false

  - type: textarea
    id: additional-info
    attributes:
      label: Additional Information
      description: Anything else that may be helpful to understand or reproduce the issue?
      placeholder: e.g. Logs, URLs, notes, etc.

  - type: markdown
    attributes:
      value: |
        Please try to give the issue an appropriate label based on the components of Core Game it likely affects.

  - type: markdown
    attributes:
      value: |
        Thank you for helping us improve Core Game! 💙
